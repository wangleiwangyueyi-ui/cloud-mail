name: Deploy Witlu and Pipjo Cloud Mail (manual)

# Manual only. Never runs on push and does not deploy nibmi-mail.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.app_domain }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.app_slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_slug: witlu
            app_domain: witlu.com
            worker_name: witlu-mail
            database_name: witlu-mail-db
          - app_slug: pipjo
            app_domain: pipjo.com
            worker_name: pipjo-mail
            database_name: pipjo-mail-db

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out shared application source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml

      - name: Validate separately configured Cloudflare resources
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          MAIL_JWT_SECRET: ${{ secrets.MAIL_JWT_SECRET }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID KV_NAMESPACE_ID MAIL_JWT_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "Missing $key for GitHub Environment ${{ matrix.app_slug }}"
              exit 1
            fi
          done

      - name: Install backend dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install and build shared frontend
        working-directory: mail-worker
        run: |
          pnpm --prefix ../mail-vue install
          pnpm --prefix ../mail-vue run build

      - name: Generate isolated Worker configuration
        working-directory: mail-worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          APP_DOMAIN: ${{ matrix.app_domain }}
          WORKER_NAME: ${{ matrix.worker_name }}
          DATABASE_NAME: ${{ matrix.database_name }}
        run: |
          set -euo pipefail
          cat > wrangler.extra.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index.js"
          compatibility_date = "2025-06-04"
          keep_vars = true

          [observability]
          enabled = true

          [[routes]]
          pattern = "mail.${APP_DOMAIN}"
          custom_domain = true

          [[d1_databases]]
          binding = "db"
          database_name = "${DATABASE_NAME}"
          database_id = "${D1_DATABASE_ID}"

          [[kv_namespaces]]
          binding = "kv"
          id = "${KV_NAMESPACE_ID}"

          [ai]
          binding = "ai"

          [assets]
          binding = "assets"
          directory = "./dist"
          not_found_handling = "single-page-application"
          run_worker_first = true

          [triggers]
          crons = ["0 * * * *"]

          [vars]
          domain = ["${APP_DOMAIN}"]
          admin = "admin@${APP_DOMAIN}"
          EOF

      - name: Deploy this domain's Worker
        working-directory: mail-worker
        run: pnpm exec wrangler deploy --config wrangler.extra.toml

      - name: Set JWT secret for this Worker only
        working-directory: mail-worker
        env:
          MAIL_JWT_SECRET: ${{ secrets.MAIL_JWT_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$MAIL_JWT_SECRET" | pnpm exec wrangler secret put jwt_secret --config wrangler.extra.toml

      - name: Print non-secret next steps
        run: |
          echo "Worker created: ${{ matrix.worker_name }}"
          echo "Custom domain: https://mail.${{ matrix.app_domain }}"
          echo "Next: initialize database from the /api/init/<JWT secret> endpoint, then create admin@${{ matrix.app_domain }}."
          echo "Next: configure Cloudflare Email Routing Catch-all to Worker ${{ matrix.worker_name }}."
          echo "Next: verify sending domain and restricted API key at Resend; configure token in Cloud Mail UI."
